<title id="ttl">Shallow sine on the angle</title>
<desc id="dsc">A shallow sine wave added to a linear tough-to-easy trend across team standing 1 to 18, target reversed so 1 (toughest) is at the top. The wavy line stays monotonic with three flat shelves — ranks 1-2, 9-10, 17-18 — joined by steeper risers, oscillating around the dashed straight trend. A dashed flat line marks parity at 9.5.</desc>
