<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 462" role="img" aria-labelledby="ttl dsc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="ttl">Flat-ended difficulty shapes under consideration</title>
<desc id="dsc">Comparison of three flat-ended difficulty target shapes versus team standing 1 to 18, with target average opponent rank reversed so 1 (toughest) is at the top. All three pin ranks 1-2 to about 6.3 and ranks 16-18 to about 12.7. The trapezoid connects them with a straight ramp; the staircase uses discrete tiers; the flat-ends-plus-bell eases with a curve that also flattens near 9.5 in the center, giving three plateaus. A dashed flat parity line sits at 9.5.</desc>
