<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 462" role="img" aria-labelledby="ttl dsc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="ttl">Non-conference difficulty curve</title>
<desc id="dsc">Target average opponent rank (1 toughest at top, 18 easiest at bottom) versus a team's overall standing 1 to 18, for shape p = 0.5, 1, 2 and 3 plus a flat parity reference. Every curve runs from about 6.3 at rank 1 to 12.7 at rank 18. p = 1 is a straight diagonal; higher p flattens the middle near 9.5 so only top and bottom teams diverge; lower p steepens the middle; the dashed line is parity at 9.5.</desc>
<style>
@media (prefers-color-scheme:dark){.axtext{fill:#cfcfcf}.axline{stroke:#cfcfcf}}
@media (prefers-color-scheme:light){.axtext{fill:#454545}.axline{stroke:#6a6a6a}}
</style>

