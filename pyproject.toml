[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "athc"
version = "0.1.0"
description = "Game plan (.pln) editor, profile (.prf) editor, and other tools for Front Page Sports Football Pro '98 coaches and league managers."
authors = [{ name = "Brian Jacobs" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "platformdirs>=4.0",
    "xlsxwriter>=3.0",  # convert-pdb writes Excel
]

[project.optional-dependencies]
# autocontinue needs a display + Windows; keep it out of the core install.
autocontinue = ["pyautogui>=0.9"]
# generate-schedule solves with OR-Tools; large, so keep it out of the core install.
schedule = ["ortools>=9.10"]
dev = ["pytest", "pyright==1.1.409", "ruff", "ipython", "pyautogui>=0.9", "openpyxl>=3.1", "ortools>=9.10"]

[project.scripts]
athc = "athc.cli:main"

# Built-in subcommands register here, same as third-party extensions.
[project.entry-points."athc.commands"]
autocontinue = "athc.cli.autocontinue:autocontinue"
config = "athc.cli.config:config"
convert-pdb = "athc.cli.convert_pdb:convert_pdb"
gameplan = "athc.cli.gameplan:gameplan"
generate-schedule = "athc.cli.generate_schedule:generate_schedule"
profile = "athc.cli.profile:profile"

# [project.urls]
# Homepage = "https://github.com/jako479/athc"
# Repository = "https://github.com/jako479/athc"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"athc.autocontinue" = ["images/*.png"]
"athc.pdbtoexcel" = ["resources/*.bin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib -m 'not slow'"
markers = [
    "slow: long-running scheduler solver tests; opt-in via `pytest -m slow` or `pytest -m ''`",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports/vars, undefined names)
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (likely bugs)
    "UP",  # pyupgrade (modernize syntax)
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "E501",   # long assertion messages are common in tests
]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
exclude = [
    "**/*.egg-info",
    "**/.*",
    "**/.venv",
    "**/__pycache__",
    "**/build",
    "**/dist",
    "**/node_modules",
    "**/output",
    "**/venv",
]
extraPaths = ["src"]
typeCheckingMode = "standard"
reportUnusedImport = "warning"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
