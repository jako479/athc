[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "athc"
version = "0.1.0"
description = "Game plan (.pln) editor, profile (.prf) editor, and other tools for Front Page Sports Football Pro '98 coaches and league managers."
authors = [{ name = "Brian Jacobs" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# All deps are required (no opt-in extras): the installer must deliver every tool
# working; extras suit pip/dev users, not a bundled installer.
dependencies = [
    "click>=8.1",
    "platformdirs>=4.0",
    "xlsxwriter>=3.0",  # convert-pdb writes Excel
    # autocontinue: pyautogui pulls pyscreeze, but pyscreeze 1.0.1 imports Pillow
    # without declaring it, so list Pillow ourselves; opencv backs confidence match.
    "pyautogui>=0.9",
    "Pillow>=10",
    "opencv-python>=4.7",
    "ortools>=9.10",  # generate-schedule solver
]

# Dev tooling is a dependency group, not an extra: extras ship to whoever
# installs athc, groups stay local. `uv sync` installs the dev group by default.
[dependency-groups]
dev = ["pytest", "pytest-cov", "pyright==1.1.409", "ruff", "ipython", "openpyxl>=3.1"]

[project.scripts]
athc = "athc.cli:main"

# Built-in subcommands register here, same as third-party extensions.
[project.entry-points."athc.commands"]
autocontinue = "athc.cli.autocontinue:autocontinue"
config = "athc.cli.config:config"
convert-pdb = "athc.cli.convert_pdb:convert_pdb"
gameplan = "athc.cli.gameplan:gameplan"
generate-schedule = "athc.cli.generate_schedule:generate_schedule"
profile = "athc.cli.profile:profile"

# [project.urls]
# Homepage = "https://github.com/jako479/athc"
# Repository = "https://github.com/jako479/athc"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"athc.autocontinue" = ["images/*.png"]
"athc.pdbtoexcel" = ["resources/*.bin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib -m 'not slow' --cov=athc --cov-report=term-missing"
filterwarnings = ["error"]
markers = [
    "slow: long-running scheduler solver tests; opt-in via `pytest -m slow` or `pytest -m ''`",
]

[tool.coverage.run]
source = ["athc"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
# Measured 94% on 2026-09-17. Two points of slack, so a real drop fails the
# test run and normal churn does not.
fail_under = 92

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports/vars, undefined names)
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (likely bugs)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib (project standard: pathlib over os.path)
    "UP",  # pyupgrade (modernize syntax)
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "E501",   # long assertion messages are common in tests
    "SIM300", # false positive: `assert CONSTANT == frozenset({...})` is not a Yoda condition
]
"research/**" = [
    "E501",   # transcribed schedule/data literals run long
]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
exclude = [
    "**/*.egg-info",
    "**/.*",
    "**/.venv",
    "**/__pycache__",
    "**/build",
    "**/dist",
    "**/node_modules",
    "**/output",
    "**/venv",
]
extraPaths = ["src", "tests"]
typeCheckingMode = "standard"
reportUnusedImport = "warning"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
