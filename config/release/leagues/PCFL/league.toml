# Open this file with: athc config edit league.toml

# PCFL league settings. Rules live here (gameplan.toml, profile.toml,
# pdbtoexcel.toml, scheduler.toml). Reinstalling never
# overwrites this file.

[league]
# The folder that holds this league's files (PCFL.lg2, PCFL.lge and the rest).
path = 'E:\SIERRA\FbPro98'
# The folder that holds this league's plays (.ply files).
play_path = 'E:\SIERRA\FbPro98\PCFL'
# Your team: its name or nickname in the league (Denver, Broncos).
# team = 'Denver'
# Optional: where you keep your profiles and game plans, when it is not where
# the league file puts them. A relative path is under this league folder.
# ppp_path = 'D:\PNFL\Denver'
# Optional: ordered rule files replacing the fixed gameplan.toml / profile.toml;
# later files layer over earlier ones.
# gameplan_rules = ['gameplan.toml']
# profile_rules = ['profile.toml']

# The league's short names for the game's play categories. A category with no
# league name is commented out and goes by its game name.
[categories.offense]
"Run Right" = "RR"
"Pass Short Right" = "PSR"
"Run Left" = "RL"
"Pass Short Left" = "PSL"
"Run Middle" = "RM"
"Pass Short Middle" = "PSM"
# "Razzle Dazzle Run" = ""
"Razzle Dazzle Pass" = "PRD"
"Pass Medium Right" = "PMR"
"Pass Medium Left" = "PML"
"Pass Medium Middle" = "PMM"
"Pass Long Right" = "PLR"
# "Pass Long Left" = ""
# "Pass Long Middle" = ""
"Goal Line Run" = "GLR"
"Goal Line Pass" = "GLP"
# "User Specific" = ""

[categories.defense]
"Run Right" = "RunRight"
"Pass Short" = "PassShort"
"Run Left" = "RunLeft"
"Run Middle" = "RunMiddle"
"Run Dazzle" = "RunDazzle"
"Pass Dazzle" = "PassDazzle"
"Pass Medium" = "PassMedium"
"Pass Long" = "PassLong"
"Goal Line Run" = "GLrun"
"Goal Line Pass" = "GLpass"
# "User Specific" = ""
