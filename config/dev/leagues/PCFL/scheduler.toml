# Scheduler tuning for `athc generate-schedule` (PCFL). Read automatically as
# leagues\<NAME>\scheduler.toml but not advertised; the commissioner edits it.
# A missing file or key falls back to the built-in default, which is the PNFL's,
# so every rule the PCFL does differently is set here.

[league]
weeks = 12               # regular-season weeks (even): 8 conference + 4 non-conference games

[solver]
# Time limits for the two solves, in CP-SAT deterministic time: the solver's
# own measure of work, not wall-clock seconds, so a fast and a slow machine
# stop at the same point. Both solves run multithreaded.
phase1_time_limit = 180.0  # picking the matchups
phase2_time_limit = 300.0  # placing the games into weeks
# Parallel search width for both phases: a number, or "auto" = this machine's
# fast threads (P-cores on Intel hybrid CPUs) minus 2. The same seed gives the
# same matchups and schedule ONLY at the same count; the report shows the count
# used, so set that number to reproduce a schedule on another machine.
solver_workers = "auto"

[phase1]
# Picking the 4 non-conference games. The cross-conference rivalry (see
# [rivalries]) is fixed; the solver picks the rest so that the conference ranks
# (1-9) of each team's 4 non-conference opponents add up close to a target.
#
# difficulty_slope sets how steep that target is from the best team to the
# worst:
#   0.0 = flat: every team's opponents add up near 20 (average rank 5)
#   2.5: #1's add up near 10 (ranks 1-4), #9's near 30 (ranks 6-9)
# These are targets, not guarantees: actual sums land close, rarely exact.
difficulty_slope = 0.0
# true = pick the non-conference games at random from the run's seed instead:
# the rivalry stays fixed and difficulty_slope is ignored.
random_nonconference = false

[phase2]
# Fixed policy rules (always enforced, no setting):
# - Every conference team once: 4 home / 4 away.
# - Non-conference: 2 home / 2 away.
# - A 9-team conference cannot pair up, so each week after the opening weeks
#   holds one cross-conference game between the two idle teams (each team's
#   fourth non-conference game).

max_consecutive_home_or_away = 3
max_consecutive_conference_home_or_away = 2  # along the sequence of conference games
opening_nonconference_weeks = 3              # weeks 1-3 are all non-conference

# PNFL home/away pattern rules, off for the PCFL
require_home_balance_per_six_weeks = false
require_home_away_streak_caps = false
require_mixed_home_away_at_season_ends = false

[rivalries]
# The final week is rivalry week: every team plays its rival. Eight pairs are
# within a conference; one crosses (each conference's leftover team).
rotate_home_by_season = true   # first-listed hosts in even seasons, second in odd
pairs = [
    ["Michigan", "Ohio State"],
    ["USC", "UCLA"],
    ["Washington", "Oregon"],
    ["Notre Dame", "Colorado"],
    ["Oklahoma", "Texas"],
    ["LSU", "Arkansas"],
    ["Georgia", "Tennessee"],
    ["Clemson", "Miami"],
    ["Penn State", "Boston College"],
]

# Teams that changed their name between seasons, one table per upcoming season:
# previous name = "new name". generate-schedule matches the previous season's
# teams to the upcoming season's by name; a team not listed keeps its name.
# [renames.2030]
# "Penn State" = "Pittsburgh"
