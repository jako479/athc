; Dev config for running athc from source. Point athc at this folder:
;   $env:ATHC_CONFIG_DIR = "$PWD\dev"
;
; Structural twin of release/athc.ini: same sections/keys. Per-league settings
; and rules live under leagues\<NAME>\ (see leagues\PNFL\league.toml; athc
; config edit league.toml opens it).

[athc]
league = PNFL

; autocontinue: every key is optional; a missing one uses the value shown.
[autocontinue]
; seconds to move the mouse to the button (0.0 = instant)
mouse_move_duration = 0.0
; seconds to wait before each click (0.0 = instant); --delay overrides it for one run
delay_before_continue = 1.0
; stop the watcher when the mouse hits the top-left corner (default on)
hot_corner = true

[convert-pdb]
calculate_percentages = true
exclude_sacks_from_pass_attempts = true
