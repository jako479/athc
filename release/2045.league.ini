# League structure for the 2045 schedule: 2045 divisions and team names, with
# the previous season's (2044) final overall standings. Each new season
# needs its own <season>.league.ini in the athc config dir (installed
# seasons are seeded).
#
# Standings are the 2044 final 1-18 finish (regular season + playoffs). Same-
# record ties are broken by strength of schedule (opponents' 2044 records,
# tougher = higher); all three 2044 ties broke cleanly on SOS. No 2044->2045
# relocation (rosters identical).


[Standings]
Order =
    New York A
    Minnesota
    Pittsburgh
    Washington
    Chicago
    Houston
    San Francisco
    Las Vegas
    Los Angeles
    Denver
    New York N
    Indianapolis
    New England
    Philadelphia
    Atlanta
    Seattle
    Green Bay
    Jacksonville


[DivisionStandings]
# Previous season's (2044) REGULAR-SEASON divisional finish, best finish first
# (excludes playoffs; no 2044->2045 relocations). Used by Scheduler C;
# Schedulers A and B ignore this section.
AFC_EAST =
    New York A
    New England
    Indianapolis
    Jacksonville
AFC_WEST =
    Houston
    Pittsburgh
    Las Vegas
    Los Angeles
    Denver
NFC_EAST =
    Washington
    New York N
    Philadelphia
    Atlanta
NFC_WEST =
    Minnesota
    Chicago
    San Francisco
    Seattle
    Green Bay
