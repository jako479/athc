# League structure for the generate-schedule command: division membership and
# the previous season's final overall standings. You supply this file; place it
# in the athc config dir alongside athc.ini.


[Divisions]
AFC_EAST =
    Buffalo
    Jacksonville
    Miami
    New England
AFC_WEST =
    Cincinnati
    Denver
    Las Vegas
    Los Angeles
    Pittsburgh
NFC_EAST =
    Atlanta
    New York
    Philadelphia
    Washington
NFC_WEST =
    Chicago
    Green Bay
    Minnesota
    San Francisco
    Seattle


[Standings]
# Previous season's final overall standings: all 18 teams, one per line, ranked
# 1st through 18th by line order (first line = best finish). Scheduler B uses
# this overall rank; per-conference ranks for Scheduler A are derived from it.
Order =
    Miami
    Minnesota
    Los Angeles
    Chicago
    Denver
    Washington
    Atlanta
    Las Vegas
    New England
    Green Bay
    Cincinnati
    New York
    San Francisco
    Jacksonville
    Philadelphia
    Pittsburgh
    Seattle
    Buffalo


[DivisionStandings]
# Previous season's REGULAR-SEASON divisional finish (excludes playoffs), best
# finish first. Same teams as [Divisions]; the line order is the finish. Used by
# Scheduler C; Schedulers A and B ignore this section.
AFC_EAST =
    Miami
    New England
    Jacksonville
    Buffalo
AFC_WEST =
    Los Angeles
    Denver
    Las Vegas
    Cincinnati
    Pittsburgh
NFC_EAST =
    Washington
    Atlanta
    New York
    Philadelphia
NFC_WEST =
    Chicago
    Minnesota
    Green Bay
    San Francisco
    Seattle
