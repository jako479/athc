# PNFL gameplan rules — the official PNFL rule set, ready to use as-is. Point
# [gameplan] rule_files (in athc.ini) at this file.
#
# Sources: PNFL offense (messageboard t=14) and defense (t=15) rules.
#
# Each section is keyed by a category's fixed SHORT label (tool-defined, same for
# every league). All per-section keys are optional; set at least one.
#   required  = true|false   default false. true -> category must appear with at
#                                        least min_count plays; false -> optional,
#                                        but the caps still apply if used.
#   min_count = <int>        default 0. minimum plays in the category.
#   max_count = <int>        maximum plays in the category.
#   max_qb_draws       = <int>   run offense only.
#   max_rollouts       = <int>   pass offense only.
#   max_timed_percent  = "n/m"   pass offense only; exact fraction 0-1.
#   max_two_dl_percent = "n/m"   defense only; exact fraction 0-1.
# Counts (min_count, max_count, max_qb_draws, max_rollouts) must be >= 0.
#
# Valid OFFENSE labels:  GLR RL RM RR  GLP PRD PLR  PML PMM PMR  PSL PSM PSR
# Valid DEFENSE labels:  GLrun RunDazzle RunLeft RunMiddle RunRight
#                        GLpass PassDazzle PassLong PassMedium PassShort

schema_version = 1

# Special teams that must each have a play assigned. Valid names:
#   "Field Goal/PAT" "Kickoff" "Punt" "Onside Kick" "Fake FG Run" "Fake FG Pass"
#   "Fake Punt Run" "Fake Punt Pass" "Free Kick" "Squib Kick"
required_special_categories = [
    "Field Goal/PAT",
    "Kickoff",
    "Punt",
    "Onside Kick",
    "Free Kick",
    "Squib Kick",
]

# Categories a gameplan must NOT contain (full game-category names). A play in
# any of these is a violation.
disallowed_offensive_categories = [
    "Pass Long Left",
    "Pass Long Middle",
    "Razzle Dazzle Run",
    "User Specific",
]
disallowed_defensive_categories = ["User Specific"]

