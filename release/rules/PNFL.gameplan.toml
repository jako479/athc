# PNFL gameplan rules — the official set, ready to use as-is.
# Wire it up: point [gameplan] rule_files (in athc.ini) at this file.
# Sources: PNFL offense (messageboard t=14) and defense (t=15).
#
# Each section is one category, keyed by its fixed SHORT label; all keys are
# optional (set at least one). Per-section keys are listed above [offense].

schema_version = 1

# Special teams that must each have a play assigned. Valid names:
#   "Field Goal/PAT" "Kickoff" "Punt" "Onside Kick" "Fake FG Run" "Fake FG Pass"
#   "Fake Punt Run" "Fake Punt Pass" "Free Kick" "Squib Kick"
required_special_categories = [
    "Field Goal/PAT",
    "Kickoff",
    "Punt",
    "Onside Kick",
    "Free Kick",
    "Squib Kick",
]

# Categories a gameplan must NOT contain (full game-category names). A play in
# any of these is a violation.
disallowed_offensive_categories = [
    "Pass Long Left",
    "Pass Long Middle",
    "Razzle Dazzle Run",
    "User Specific",
]
disallowed_defensive_categories = ["User Specific"]

# ── Offense ───────────────────────────────────────────────────────────────────
# Per-section keys (counts >= 0):
#   required  = true|false   default false; true -> needs >= min_count plays
#   min_count = <int>        minimum plays in the category (default 0)
#   max_count = <int>        maximum plays
#   max_qb_draws       = <int>   run offense only
#   max_rollouts       = <int>   pass offense only
#   max_timed_percent  = "n/m"   pass offense only; exact fraction 0-1
#   max_two_dl_percent = "n/m"   defense only; exact fraction 0-1
# Labels: GLR RL RM RR  GLP PRD PLR PML PMM PMR  PSL PSM PSR

[offense.RM]
required = true
min_count = 10
max_qb_draws = 2

[offense.RL]
required = false
min_count = 4
max_qb_draws = 2

[offense.RR]
required = false
min_count = 4
max_qb_draws = 2

[offense.GLR]
required = false
min_count = 3

[offense.PSL]
required = true
min_count = 5
max_rollouts = 2
max_timed_percent = "1/2"

[offense.PSM]
required = true
min_count = 5
max_rollouts = 2
max_timed_percent = "1/2"

[offense.PSR]
required = true
min_count = 5
max_rollouts = 2
max_timed_percent = "1/2"

[offense.PML]
required = true
min_count = 5
max_rollouts = 2
max_timed_percent = "1/2"

[offense.PMM]
required = true
min_count = 5
max_rollouts = 2
max_timed_percent = "1/2"

[offense.PMR]
required = true
min_count = 5
max_rollouts = 2
max_timed_percent = "1/2"

[offense.PLR]
required = true
min_count = 4
max_rollouts = 2
max_timed_percent = "1/2"

[offense.PRD]
required = true
min_count = 4
max_rollouts = 2
max_timed_percent = "1/2"

[offense.GLP]
required = false
min_count = 3
max_rollouts = 2
max_timed_percent = "1/2"

# ── Defense ───────────────────────────────────────────────────────────────────
# Labels: GLrun RunDazzle RunLeft RunMiddle RunRight  GLpass PassDazzle PassLong PassMedium PassShort

[defense.RunLeft]
required = true
min_count = 6

[defense.RunMiddle]
required = true
min_count = 6

[defense.RunRight]
required = true
min_count = 6

[defense.PassShort]
required = true
min_count = 6
max_two_dl_percent = "1/3"

[defense.PassMedium]
required = true
min_count = 6
max_two_dl_percent = "1/3"

[defense.PassLong]
required = true
min_count = 6
max_two_dl_percent = "1/2"

[defense.GLrun]
required = false
min_count = 3

[defense.GLpass]
required = false
min_count = 3

[defense.RunDazzle]
required = false
min_count = 4

[defense.PassDazzle]
required = false
min_count = 4
max_two_dl_percent = "1/2"
