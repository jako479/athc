# PNFL playpool rules — filename filters that set each filename-derived play
# attribute. Point [league.PNFL] PlayPoolRules (in athc.ini) at this file, or
# pass --playpool-rules. Folder conventions, play attributes, and enums are fixed
# in code; only these filename filters are league data, so another league with
# the same folder layout but different play names just copies and edits this file.
#
# Sections (one per filename-derived attribute):
#   [TimedPass]    a pass play's pass_logic = Timed (else Check Receivers)
#   [RolloutPass]  a pass play's rollout flag
#   [QBRun]        a run play's qb_draw flag
#
# Filter options, valid in any section (all optional, all CASE-SENSITIVE). A play
# name matches the attribute when it hits ANY of suffix_any / regex_any / include
# AND NONE of suffix_none / regex_none / exclude (the vetoes win):
#   suffix_any  = [...]   name ends with any of these
#   suffix_none = [...]   veto: name ends with any of these
#   regex_any   = [...]   a regex searches the name
#   regex_none  = [...]   veto: a regex searches the name
#   include     = [...]   force on: exact play names
#   exclude     = [...]   force off: exact play names

schema_version = 1

[TimedPass]
suffix_any = ["T", "T1", "T2", "TR", "RT", "Ty", "T01", "T01R", "T02", "Top"]
suffix_none = ["OUT", "SLT1", "FLT1", "OUT1"]
regex_any = ["(?i)lob.$"]
include = ["GBglpH1L", "GBglpH1R", "GBglpYL", "GBglpYR", "LVHglp01", "LVIglp03", "SGZfade"]

[RolloutPass]
suffix_any = ["R", "RT", "TR", "wagL", "rolL"]
suffix_none = ["CR", "WR", "scrR", "trpR", "nRT", "NRT"]

[QBRun]
regex_any = ["^.1", "^..1"]  # 2nd or 3rd character is "1"
