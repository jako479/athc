# Scheduler tuning for `athc generate-schedule`. Installed to the athc config
# dir's rules\ folder but not advertised; the commissioner edits it. A missing
# file or key falls back to the built-in default.

schema_version = 1

[difficulty]
# Scheduler C. Two non-conference games are fixed by division standings
# (AE1 vs NE1 and NW1, etc.; 5ths play each other). The solver picks the
# rest, tilting each team's average opponent conference rank (1-9) by
# c_spread:
#   0.0 = flat: all teams' opponents average rank 5
#   1.5 = default: #1's opponents average rank 3.5
#   2.5 = max: #1's opponents average rank 3
# Above 2.5 changes nothing.
c_spread = 1.7

# Scheduler D: same as C, except the tilt counts only the games the solver
# picks -- the two fixed games don't offset them.
d_spread = 1.5

[solver]
time_limit = 1800.0       # max seconds for the week-placement (phase-2) solve
phase1_time_limit = 180.0 # max seconds for the matchup (phase-1) solve

[phase2]
# Week-placement rule amounts (defaults shown). Amounts only -- the rules
# themselves and league/conference sizes are fixed.

# Home/away sequencing
max_consecutive_home_or_away = 3
min_home_per_six_weeks = 2
max_home_per_six_weeks = 4
max_three_game_home_away_streaks = 1

# Divisional sequencing
max_consecutive_divisional = 3
max_three_game_divisional_streaks = 1
max_non_interleaved_divisional_opponents = 2

# Divisional density (max divisional games within a span of weeks)
five_team_max_divisional_in_10 = 7
five_team_max_divisional_in_9 = 6
four_team_max_divisional_in_8 = 5
four_team_max_divisional_in_7 = 3

# Divisional games in the second half of the season
five_team_second_half_divisional_min = 4
four_team_second_half_divisional_min = 3

# Conference cross-division home games hosted
five_team_conference_home = 2
four_team_conference_home_min = 2
four_team_conference_home_max = 3

# Non-conference home games hosted
five_team_nonconference_home = 2
four_team_nonconference_home_min = 2
four_team_nonconference_home_max = 3

# Week 16 / late season
week_16_divisional_games = 8
min_late_divisional_games = 1
