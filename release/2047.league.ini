# League structure for the 2047 schedule: 2047 divisions and team names, with
# the previous season's (2046) final overall standings. Each new season
# needs its own <season>.league.ini in the athc config dir (installed
# seasons are seeded).
#
# Standings are the 2046 final 1-18 finish (regular season + playoffs). Same-
# record ties are broken by strength of schedule (opponents' 2046 records,
# tougher = higher); Chicago/Green Bay tied on SOS and are split by 2046 division
# finish (Chicago ahead). 2046->2047 relocations: Houston->Miami,
# New York A->Cincinnati, Indianapolis->Baltimore, New York N->New York.


[Divisions]
AFC_EAST =
    Buffalo
    Jacksonville
    Miami
    New England
AFC_WEST =
    Baltimore
    Cincinnati
    Denver
    Las Vegas
    Pittsburgh
NFC_EAST =
    Atlanta
    New York
    Philadelphia
    Washington
NFC_WEST =
    Chicago
    Green Bay
    Minnesota
    San Francisco
    Seattle


[Standings]
Order =
    Pittsburgh
    Washington
    Minnesota
    Baltimore
    Miami
    Buffalo
    Seattle
    San Francisco
    Cincinnati
    Las Vegas
    Philadelphia
    Chicago
    Green Bay
    Denver
    Jacksonville
    Atlanta
    New York
    New England


[DivisionStandings]
# Previous season's (2046) REGULAR-SEASON divisional finish, mapped to the 2047
# teams/divisions per the relocations noted above (best finish first; excludes
# playoffs). Used by Scheduler C; Schedulers A and B ignore this section.
AFC_EAST =
    Miami
    Buffalo
    Jacksonville
    New England
AFC_WEST =
    Pittsburgh
    Cincinnati
    Baltimore
    Las Vegas
    Denver
NFC_EAST =
