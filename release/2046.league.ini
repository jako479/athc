# League structure for the 2046 schedule: 2046 divisions and team names, with
# the previous season's (2045) final overall standings. Each new season
# needs its own <season>.league.ini in the athc config dir (installed
# seasons are seeded).
#
# Standings are the 2045 final 1-18 finish (regular season + playoffs). Same-
# record ties are broken by strength of schedule (opponents' 2045 records,
# tougher = higher); all four 2045 ties broke cleanly on SOS. 2045->2046
# relocation: Los Angeles -> Buffalo (only roster change).


[Standings]
Order =
    Houston
    Minnesota
    New York A
    San Francisco
    Washington
    Philadelphia
    Denver
    Pittsburgh
    Buffalo
    Chicago
    Indianapolis
    New England
    Seattle
    Green Bay
    Jacksonville
    Las Vegas
    New York N
    Atlanta


[DivisionStandings]
# Previous season's (2045) REGULAR-SEASON divisional finish, mapped to the 2046
# teams/divisions per the relocation noted above (best finish first; excludes
# playoffs). Used by Scheduler C; Schedulers A and B ignore this section.
AFC_EAST =
    New York A
    Buffalo
    Indianapolis
    New England
AFC_WEST =
    Houston
    Denver
    Pittsburgh
    Jacksonville
    Las Vegas
NFC_EAST =
    Washington
    Philadelphia
    Atlanta
    New York N
NFC_WEST =
    Minnesota
    San Francisco
    Chicago
    Seattle
    Green Bay
