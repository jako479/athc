# League structure for the 2049 schedule: 2049 divisions and team names, with
# the previous season's (2048) final standings. Each new season needs its own
# <season>.league.ini in the athc config dir (installed seasons are seeded).
#
# 2048->2049 renames (divisions otherwise unchanged): Buffalo->San Diego,
# Los Angeles->Baltimore, Seattle->Detroit.


[Standings]
# Past data: 2048 final overall standings (regular season + playoffs): all 18
# teams, one per line, ranked 1st through 18th by line order (first line = best
# finish), written with 2049 team names. Per-conference 1-9 ranks derive from
# this order.
Order =
    Miami
    Chicago
    Washington
    Cincinnati
    Pittsburgh
    San Diego
    Minnesota
    Green Bay
    New England
    Las Vegas
    San Francisco
    Jacksonville
    Atlanta
    Denver
    Baltimore
    Detroit
    New York
    Philadelphia


[DivisionStandings]
# Past data: 2048 REGULAR-SEASON divisional finish (excludes playoffs), best
# finish first, written with 2049 team names. This section defines each
# division's teams; line order = finish.
AFC_EAST =
    Miami
    San Diego
    New England
    Jacksonville
AFC_WEST =
    Cincinnati
    Pittsburgh
    Las Vegas
    Denver
    Baltimore
NFC_EAST =
    Washington
    Atlanta
    New York
    Philadelphia
NFC_WEST =
    Chicago
    Minnesota
    Green Bay
    San Francisco
    Detroit
