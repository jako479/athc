; athc settings. This file is yours -- edit values to taste; reinstalling never
; overwrites it. Every section/key is optional and falls back to a sensible
; default, so only what you want to change needs to be here.
;
; See athc.ini.example for every available section and setting.

; autocontinue requires its settings (a clicking watcher shouldn't guess timings).
[autocontinue]
; seconds to move the mouse to the button (0.0 = instant)
mouse_move_duration = 0.0
; seconds before clicking; 0.0 = instant, -1.0 = find but don't click
delay_before_continue = 1.0
