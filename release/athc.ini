; athc settings -- a ready-to-run PNFL setup. This file is yours: edit values to
; taste; reinstalling never overwrites it (delete it to get a fresh copy).
;
; Rule-file paths are relative to this folder, so they point at the bundled
; rules\ sets and work as-is. The one thing you must set is your play folder:
; edit PlayPath below to your FbPro98 league plays directory.
;
; Every section/key is optional and falls back to a sensible default. This file
; itself documents every setting; 'athc <command> --help' covers the rest.

[athc]
; league used by --league tools when no flag/env is set
default_league = PNFL

; autocontinue requires its settings (a clicking watcher shouldn't guess timings).
[autocontinue]
; seconds to move the mouse to the button (0.0 = instant)
mouse_move_duration = 0.0
; seconds before clicking; 0.0 = instant, -1.0 = find but don't click
delay_before_continue = 1.0
; stop the watcher when the mouse hits the top-left corner (default on)
hot_corner = true

[gameplan]
; one gameplan-rules TOML path per line (relative -> this config folder)
rule_files =
    rules\PNFL.gameplan.toml

[profile]
; one profile-rules TOML path per line (relative -> this config folder)
rule_files =
    rules\PNFL.profile.toml

[convert-pdb]
; the play pool to classify/tag; usually passed per-run with --play-path instead
; play_path = D:\SIERRA\FBPRO98\PNFL\plays
playpool_rules = rules\PNFL.playpool.toml

[league.PNFL]
; REQUIRED for gameplan/profile -- set to your FbPro98 league plays folder.
PlayPath = C:\SIERRA\FBPRO98\PNFL
PlayPoolRules = rules\PNFL.playpool.toml
