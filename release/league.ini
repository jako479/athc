# League structure for the generate-schedule command: division membership and
# the previous season's final overall standings. You supply this file; place it
# in the athc config dir alongside athc.ini.


[Divisions]
AFC_EAST =
    Buffalo
    Jacksonville
    Miami
    New England
AFC_WEST =
    Cincinnati
    Denver
    Las Vegas
    Los Angeles
    Pittsburgh
NFC_EAST =
    Atlanta
    New York
    Philadelphia
    Washington
NFC_WEST =
    Chicago
    Green Bay
    Minnesota
    San Francisco
    Seattle


[Standings]
# Previous season's final overall standings: all 18 teams, one per line, ranked
# 1st through 18th by line order (first line = best finish). The new scheduler
# uses this overall rank; per-conference ranks for the older scheduler are
# derived from it.
Order =
    Miami
    Minnesota
    Los Angeles
    Chicago
    Denver
    Washington
    Atlanta
    Las Vegas
    New England
    Green Bay
    Cincinnati
    New York
    San Francisco
    Jacksonville
    Philadelphia
    Pittsburgh
    Seattle
    Buffalo
