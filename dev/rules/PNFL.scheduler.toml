# Scheduler tuning for `athc generate-schedule`. Installed to the athc config
# dir's rules\ folder but not advertised; the commissioner edits it. A missing
# file or key falls back to the built-in default.

schema_version = 1

[difficulty]
# Two non-conference games are fixed by division standings (AE1 vs NE1 and
# NW1, etc.; 5ths play each other). The solver picks the rest, tilting each
# team's average opponent conference rank (1-9) by spread. These are targets
# the solver shoots for, not guarantees -- actual averages land close, rarely
# exact:
#   0.0 = flat: every team's opponents average near rank 5
#   1.5: #1's opponents average near 3.5 (e.g. ranks 1,2,3,5,6)
#   1.8: #1's opponents average near 3.2 (e.g. ranks 1,2,3,4,6)
#   2.5 = default and max: #1's opponents average near 3.0 (e.g. ranks 1,2,3,4,5)
# Linear: every 0.1 of spread moves #1's average by 0.1. Above 2.5
# changes nothing.
spread = 2.5

[solver]
time_limit = 300.0       # max deterministic time for the week-placement (phase-2) solve (multithreaded; not wall-clock seconds)
phase1_time_limit = 60.0 # max seconds for the matchup (phase-1) solve

[phase2]
# Week-placement rule amounts and toggles (defaults shown). The rules
# themselves and league/conference sizes are fixed.
#
# Fixed policy rules (always enforced, no setting):
# - No pair of teams meets in back-to-back weeks.
# - No 3-game home/away streak to start or end the season.
# - No 3 straight divisional games to start or end the season.
# - Conference hosting: 5-team-division teams host 2 of 4; 4-team host 2-3 of 5.
# - Non-conference hosting: same split.
# - Divisional pairs split 1 home / 1 away.

# Home/away sequencing
max_consecutive_home_or_away = 3
min_home_per_six_weeks = 2
max_home_per_six_weeks = 4
max_three_game_home_away_streaks = 1

# Divisional sequencing
max_consecutive_divisional = 3
max_three_game_divisional_streaks = 1
max_non_interleaved_divisional_opponents = 2
max_teams_divisional_weeks_1_and_2 = 4

# Divisional density (max divisional games within a span of weeks). A 9-window
# cap forces <=7 in any 10; a 7-window cap forces <=5 in any 8.
five_team_max_divisional_in_9 = 6
four_team_max_divisional_in_7 = 4

# Divisional front-load caps (max divisional games in the first N weeks)
five_team_max_divisional_first_6 = 4
five_team_max_divisional_first_8 = 5
five_team_max_divisional_first_10 = 6
four_team_max_divisional_first_4 = 2
four_team_max_divisional_first_8 = 3
four_team_max_divisional_first_10 = 4
# At most this many teams open weeks 1-2 both divisional (a divisional pair), by size
four_team_max_teams_open_divisional_pair = 1
five_team_max_teams_open_divisional_pair = 2

# League-wide caps (prevent per-team rules piling up across teams)
max_teams_with_home_streak = 9
max_teams_with_away_streak = 3
max_teams_with_divisional_streak = 6
max_teams_with_two_bunched_rivals = 2
max_close_rematches = 3

# Soft objective: prefer NFL-typical schedules. Each metric is penalized for
# landing outside its band [lo, hi]; weight is the per-step cost (rarity =
# 1/scaled-SD of the NFL per-season spread). The caps above stay as backstops.
soft_home_streak_lo = 5
soft_home_streak_hi = 7
soft_home_streak_weight = 155
soft_away_streak_lo = 0
soft_away_streak_hi = 4
soft_away_streak_weight = 115
soft_divisional_streak_lo = 2
soft_divisional_streak_hi = 6
soft_divisional_streak_weight = 109
soft_four_team_frontload_lo = 3
soft_four_team_frontload_hi = 5
soft_four_team_frontload_weight = 111
soft_five_team_frontload_lo = 2
soft_five_team_frontload_hi = 5
soft_five_team_frontload_weight = 68
soft_non_interleaved_lo = 0
soft_non_interleaved_hi = 3
soft_non_interleaved_weight = 116
soft_close_rematches_lo = 0
soft_close_rematches_hi = 2
soft_close_rematches_weight = 215
soft_open_weeks_1_2_lo = 0
soft_open_weeks_1_2_hi = 4
soft_open_weeks_1_2_weight = 100

# Season ending
require_final_week_divisional = true         # final week is all divisional games (8 of 9)
require_divisional_in_final_two_weeks = true # every team plays at least one in the last 2 weeks
