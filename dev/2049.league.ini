# League structure for the 2049 schedule: 2049 divisions and team names, with
# the previous season's (2048) final standings.
#
# 2048->2049 renames (divisions otherwise unchanged): Buffalo->San Diego,
# Los Angeles->Baltimore, Seattle->Detroit.


[Divisions]
# Current 2049 season: division membership, using 2049 team names.
AFC_EAST =
    Jacksonville
    Miami
    New England
    San Diego
AFC_WEST =
    Baltimore
    Cincinnati
    Denver
    Las Vegas
    Pittsburgh
NFC_EAST =
    Atlanta
    New York
    Philadelphia
    Washington
NFC_WEST =
    Chicago
    Detroit
    Green Bay
    Minnesota
    San Francisco


[Standings]
# Past data: 2048 final overall standings (regular season + playoffs): all 18
# teams, one per line, ranked 1st through 18th by line order (first line = best
# finish), written with 2049 team names. Scheduler B uses this overall rank;
# per-conference ranks for Scheduler A are derived from it.
Order =
    Miami
    Chicago
    Washington
    Cincinnati
    Pittsburgh
    San Diego
    Minnesota
    Green Bay
    New England
    Las Vegas
    San Francisco
    Jacksonville
    Atlanta
    Denver
    Baltimore
    Detroit
    New York
    Philadelphia


[DivisionStandings]
# Past data: 2048 REGULAR-SEASON divisional finish (excludes playoffs), best
# finish first, written with 2049 team names. Same teams as [Divisions]; the
# line order is the finish. Required by Schedulers C and D; A and B ignore it.
AFC_EAST =
    Miami
    San Diego
    New England
    Jacksonville
