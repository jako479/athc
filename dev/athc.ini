; Dev config for running athc from source. Point athc at this folder:
;   $env:ATHC_CONFIG_DIR = "$PWD\dev"
; Gitignored (dev/) -- edit paths to your machine freely.
;
; Structural twin of release/athc.ini: same sections/keys, rule paths relative to
; this config dir (-> dev/rules/). The only dev-specific values are the play paths,
; wired to the repo's curated test pool so the tools work as-is from source.

[athc]
default_league = PNFL

[autocontinue]
mouse_move_duration = 0.0
delay_before_continue = 1.0
hot_corner = true

[gameplan]
rule_files =
    rules\PNFL.gameplan.toml

[profile]
rule_files =
    rules\PNFL.profile.toml

[convert-pdb]
play_path = C:\Users\Brian\Projects\PNFL\athc\tests\integration\data\plays
playpool_rules = rules\PNFL.playpool.toml

[league.PNFL]
PlayPath = C:\Users\Brian\Projects\PNFL\athc\tests\integration\data\plays
PlayPoolRules = rules\PNFL.playpool.toml
