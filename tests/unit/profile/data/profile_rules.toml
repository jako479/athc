# Test coaching-profile rules (a full, realistic rule set).

audibles_allowed = false
min_categories = 2

allowed_offensive_categories = [
    "GLR", "RL", "RM", "RR",
    "GLP", "PRD", "PLR",
    "PML", "PMM", "PMR",
    "PSL", "PSM", "PSR",
]
allowed_defensive_categories = [
    "GLrun", "RunDazzle", "RunLeft", "RunMiddle", "RunRight",
    "GLpass", "PassDazzle", "PassLong", "PassMedium", "PassShort",
]

[gameplan_compatibility]
require_all_profile_categories_in_gameplan = true

[substitutions]
QB = { out_percent = 75, in_percent = 80 }
OL = { max_out_percent = 95, min_in_percent = 96, max_in_percent = 100 }
RB = { max_out_percent = 95, min_in_percent = 96, max_in_percent = 100 }
WR = { max_out_percent = 95, min_in_percent = 96, max_in_percent = 100 }
DL = { max_out_percent = 95, min_in_percent = 96, max_in_percent = 100 }
LB = { max_out_percent = 95, min_in_percent = 96, max_in_percent = 100 }
DB = { max_out_percent = 95, min_in_percent = 96, max_in_percent = 100 }

# Min rises to 3 above 5:00, except backed up to a team's own goal line.
[offense.min_categories_three]
time = ">5:00"
fields = ["inside_def_5", "def_5_to_def_35", "def_35_to_off_35", "off_35_to_off_5"]
min_categories = 3

[defense.min_categories_three]
time = ">5:00"
fields = ["def_5_to_def_35", "def_35_to_off_35", "off_35_to_off_5", "inside_off_5"]
min_categories = 3

# ── OFFENSE matrix ────────────────────────────────────────────────────────────

[offense.first_and_0_1]
time = ">5:00"
down = "first"
yards = "0-1"
fields = [
    "inside_def_5",
    "def_5_to_def_35",
    "def_35_to_off_35",
    "off_35_to_off_5",
    "inside_off_5",
]
allowed = ["RL", "RM", "PSL", "PML", "GLR", "GLP"]

[offense.first_and_2_5_goal_lines]
time = ">5:00"
down = "first"
yards = "2-5"
fields = ["inside_def_5", "inside_off_5"]
allowed = ["RL", "RM", "PSL", "PML", "GLR", "GLP"]

[offense.first_and_2_5]
time = ">5:00"
down = "first"
yards = "2-5"
