# Test playpool rules — the PNFL filename filters, plus a `FAKETR` in TimedPass
# exclude so a "TR"-ending play (timed + rollout by suffix) ends up rollout-only.

schema_version = 1

[TimedPass]
suffix_any = ["T", "T1", "T2", "TR", "RT", "Ty", "T01", "T01R", "T02", "Top"]
suffix_none = ["OUT", "SLT1", "FLT1", "OUT1"]
regex_any = ["(?i)lob.$"]
include = ["GBglpH1L", "GBglpH1R", "GBglpYL", "GBglpYR", "LVHglp01", "LVIglp03", "SGZfade"]
exclude = ["FAKETR"]

[RolloutPass]
suffix_any = ["R", "RT", "TR", "wagL", "rolL"]
suffix_none = ["CR", "WR", "scrR", "trpR", "nRT", "NRT"]

[QBRun]
regex_any = ["^.1", "^..1"]
