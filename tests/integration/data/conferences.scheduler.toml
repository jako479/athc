# Frozen scheduler rules for the conference test league (the generate-schedule golden and
# model-checksum tests). Test-owned; mirrors the shipped conference-league rules except
# difficulty_slope. Installed to the test league's
# folder for the test run. A missing key falls back to the built-in default
# (the divisional league's), so every rule this league does differently is set here.

[league]
weeks = 12               # regular-season weeks (even): 8 conference + 4 non-conference games

[solver]
phase1_time_limit = 120.0 # max deterministic time for the matchup (phase-1) solve
phase2_time_limit = 300.0 # max deterministic time for the week-placement (phase-2) solve
solver_workers = 8       # both phases; keep fixed everywhere: the matchups and schedule change with the worker count

[phase1]
difficulty_slope = 2.5  # 2.5, not the flat 0.0: proving the flat line optimal takes ~2 s, ~0.2 s at 2.5; the checksum test runs in the fast suite
random_nonconference = false

[phase2]
# Fixed policy rules (always enforced, no setting):
# - Every conference team once: 4 home / 4 away.
# - Non-conference: 2 home / 2 away.
# - A 9-team conference cannot pair up, so each week after the opening weeks
#   holds one cross-conference game between the two idle teams (each team's
#   fourth non-conference game).

max_consecutive_home_or_away = 3
max_consecutive_conference_home_or_away = 2  # along the sequence of conference games
opening_nonconference_weeks = 3              # weeks 1-3 are all non-conference

# NFL-pattern home/away rules, off for this league
require_home_balance_per_six_weeks = false
require_home_away_streak_caps = false
require_mixed_home_away_at_season_ends = false

[rivalries]
# The final week is rivalry week: every team plays its rival. Eight pairs are
# within a conference; one crosses (each conference's leftover team).
rotate_home_by_season = true   # first-listed hosts in even seasons, second in odd
pairs = [
    ["Michigan", "Ohio State"],
    ["USC", "UCLA"],
    ["Washington", "Oregon"],
    ["Notre Dame", "Colorado"],
    ["Oklahoma", "Texas"],
    ["LSU", "Arkansas"],
    ["Georgia", "Tennessee"],
    ["Clemson", "Miami"],
    ["Penn State", "Boston College"],
]
